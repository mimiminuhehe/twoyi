name: Build Twoyi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK & CMake
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;23.1.7779620" "cmake;3.18.1"

      - name: Install Rust & Cargo XDK
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cargo-xdk

      - name: Fix Package R & BuildConfig Imports
        run: |
          find app/src/main/java -name "*.java" -exec sed -i 's/import io\.twoyi\.R;/import com.google.enterprise.webapp.x40db2d910196fec3.R;/g; s/import io\.twoyi\.BuildConfig;/import com.google.enterprise.webapp.x40db2d910196fec3.BuildConfig;/g' {} +
          sed -i 's/^package io\.twoyi;/package io.twoyi;\nimport com.google.enterprise.webapp.x40db2d910196fec3.R;\nimport com.google.enterprise.webapp.x40db2d910196fec3.BuildConfig;/g' app/src/main/java/io/twoyi/*.java

      - name: Download Official Assets (rootfs.7z & version)
        run: |
          curl -fL "https://github.com" -o official.apk || \
          curl -fL "https://github.com" -o official.apk || \
          curl -fL "https://github.com" -o official.apk
          unzip -o official.apk "assets/*" -d app/src/main/
          rm -f official.apk

      - name: Build Debug APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/23.1.7779620"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/23.1.7779620"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: twoyi-custom-apk
          path: app/build/outputs/apk/debug/*.apk

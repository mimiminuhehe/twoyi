name: Build Twoyi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK & CMake
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;23.1.7779620" "cmake;3.18.1"

      - name: Install Rust & Cargo XDK
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cargo-xdk

      - name: Fix Package R, Authorities & Hardcoded Paths
        run: |
          NEW_PKG="com.google.enterprise.webapp.x40db2d910196fec3"
          find app/src/main/java -name "*.java" -exec sed -i "s/import io\.twoyi\.R;/import ${NEW_PKG}.R;/g; s/import io\.twoyi\.BuildConfig;/import ${NEW_PKG}.BuildConfig;/g" {} +
          sed -i "s/^package io\.twoyi;/package io.twoyi;\nimport ${NEW_PKG}.R;\nimport ${NEW_PKG}.BuildConfig;/g" app/src/main/java/io/twoyi/*.java
          find app/src/main -type f \( -name "*.java" -o -name "*.xml" -o -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.rs" \) -exec sed -i "s|/data/data/io\.twoyi|/data/data/${NEW_PKG}|g; s|/data/user/0/io\.twoyi|/data/user/0/${NEW_PKG}|g; s|\"io\.twoyi\"|\"${NEW_PKG}\"|g; s|io\.twoyi\.documents|${NEW_PKG}.documents|g; s|io\.twoyi\.fileprovider|${NEW_PKG}.fileprovider|g" {} +

      - name: Download My Assets from Release
        run: |
          mkdir -p app/src/main/assets
          curl -fL "https://github.com" -o app/src/main/assets/rootfs.7z
          curl -fL "https://github.com" -o app/src/main/assets/version
          ls -lh app/src/main/assets/

      - name: Build Debug APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/23.1.7779620"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/23.1.7779620"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: twoyi-custom-apk
          path: app/build/outputs/apk/debug/*.apk
